name: Sync Delta Mart Catalogue from Dropbox

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Dropbox catalogue
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}

        run: |

          python3 <<'PY'

          import os
          import json
          import csv
          import html
          import urllib.request
          import urllib.parse
          import urllib.error
          import base64
          import time
          from pathlib import Path

          APP_KEY = os.environ["DROPBOX_APP_KEY"]
          APP_SECRET = os.environ["DROPBOX_APP_SECRET"]
          REFRESH_TOKEN = os.environ["DROPBOX_REFRESH_TOKEN"]

          DROPBOX_IMAGE_FOLDER = (
              "/Blogger/Website catalogue/Catalogue/"
              "archive/kurta_images_and_annotations/FINAL_KURTA"
          )

          DROPBOX_CSV_FILE = (
              "/Blogger/Website catalogue/Catalogue/"
              "archive/kurta_attributes.csv"
          )

          LOCAL_IMAGE_FOLDER = Path("images")
          PRODUCTS_FILE = Path("products.json")

          LOCAL_IMAGE_FOLDER.mkdir(exist_ok=True)

          ACCESS_TOKEN = None
          LAST_TOKEN_REFRESH = 0

          # Refresh before the Dropbox access token gets old.
          TOKEN_REFRESH_INTERVAL = 45 * 60


          def refresh_access_token():

              global ACCESS_TOKEN
              global LAST_TOKEN_REFRESH

              print("Refreshing Dropbox access token...")

              credentials = base64.b64encode(
                  f"{APP_KEY}:{APP_SECRET}".encode()
              ).decode()

              token_data = urllib.parse.urlencode({
                  "grant_type": "refresh_token",
                  "refresh_token": REFRESH_TOKEN
              }).encode()

              request = urllib.request.Request(
                  "https://api.dropboxapi.com/oauth2/token",
                  data=token_data,
                  headers={
                      "Authorization": f"Basic {credentials}",
                      "Content-Type":
                          "application/x-www-form-urlencoded"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  result = json.load(response)

              ACCESS_TOKEN = result["access_token"]
              LAST_TOKEN_REFRESH = time.time()

              print("Dropbox access token refreshed successfully.")


          def ensure_fresh_token():

              if (
                  ACCESS_TOKEN is None
                  or time.time() - LAST_TOKEN_REFRESH
                  >= TOKEN_REFRESH_INTERVAL
              ):
                  refresh_access_token()


          def dropbox_download(path):

              global ACCESS_TOKEN

              for attempt in range(2):

                  ensure_fresh_token()

                  headers = {
                      "Authorization":
                          f"Bearer {ACCESS_TOKEN}",
                      "Dropbox-API-Arg":
                          json.dumps({
                              "path": path
                          })
                  }

                  request = urllib.request.Request(
                      "https://content.dropboxapi.com/2/files/download",
                      headers=headers,
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request
                      ) as response:
                          return response.read()

                  except urllib.error.HTTPError as error:

                      if error.code == 401 and attempt == 0:

                          print(
                              "Dropbox returned 401. "
                              "Refreshing token and retrying..."
                          )

                          refresh_access_token()
                          continue

                      raise


          # ---------------------------------------------------------
          # STEP 1: Get Dropbox token
          # ---------------------------------------------------------

          refresh_access_token()


          # ---------------------------------------------------------
          # STEP 2: Download product CSV
          # ---------------------------------------------------------

          print("Downloading product database from Dropbox...")

          csv_headers = {
              "Authorization":
                  f"Bearer {ACCESS_TOKEN}",
              "Dropbox-API-Arg":
                  json.dumps({
                      "path": DROPBOX_CSV_FILE
                  })
          }

          csv_request = urllib.request.Request(
              "https://content.dropboxapi.com/2/files/download",
              headers=csv_headers,
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  csv_request
              ) as response:
                  csv_data = response.read().decode(
                      "utf-8-sig"
                  )

          except urllib.error.HTTPError as error:

              if error.code == 401:

                  refresh_access_token()

                  csv_headers["Authorization"] = (
                      f"Bearer {ACCESS_TOKEN}"
                  )

                  csv_request = urllib.request.Request(
                      "https://content.dropboxapi.com/2/files/download",
                      headers=csv_headers,
                      method="POST"
                  )

                  with urllib.request.urlopen(
                      csv_request
                  ) as response:
                      csv_data = response.read().decode(
                          "utf-8-sig"
                      )

              else:
                  raise


          print(
              f"Product CSV downloaded successfully: "
              f"{len(csv_data)} characters"
          )


          # ---------------------------------------------------------
          # STEP 3: Generate products.json
          # ---------------------------------------------------------

          print("Generating full product database...")

          reader = csv.DictReader(
              csv_data.splitlines()
          )

          products = []

          for row in reader:

              product_id = (
                  row.get("Product ID") or ""
              ).strip()

              if not product_id:
                  continue


              def clean(value):

                  value = (value or "").strip()

                  if not value:
                      return ""

                  return html.unescape(value)


              try:

                  price = int(
                      float(
                          (row.get("Price") or "0").strip()
                      )
                  )

              except ValueError:

                  price = 0


              product = {

                  "id": product_id,

                  "name":
                      clean(row.get("Description")),

                  "price":
                      price,

                  "colour":
                      clean(row.get("Color")),

                  "fabric":
                      clean(row.get("Fabric")),

                  "fabricPurity":
                      clean(row.get("Fabric Purity")),

                  "sleeve":
                      clean(row.get("Sleeve")),

                  "shape":
                      clean(row.get("Shape")),

                  "neck":
                      clean(row.get("Neck")),

                  "printPattern":
                      clean(
                          row.get(
                              "Print or Pattern Type"
                          )
                      ),

                  "slitDetail":
                      clean(
                          row.get("Slit Detail")
                      ),

                  "length":
                      clean(row.get("Length")),

                  "hemline":
                      clean(row.get("Hemline")),

                  "image":
                      "https://cdn.jsdelivr.net/gh/"
                      "thetapaskar/"
                      "delta-mart-catalogue@main/"
                      "images/"
                      f"{product_id}.jpg"
              }

              products.append(product)


          PRODUCTS_FILE.write_text(
              json.dumps(
                  products,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          print(
              f"Product database generated: "
              f"{len(products)} products"
          )


          # ---------------------------------------------------------
          # STEP 4: Get Dropbox image list
          # ---------------------------------------------------------

          print("Getting Dropbox image list...")


          def api_request(url, body):

              ensure_fresh_token()

              headers = {
                  "Authorization":
                      f"Bearer {ACCESS_TOKEN}",
                  "Content-Type":
                      "application/json"
              }

              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers=headers,
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request
                  ) as response:
                      return json.load(response)

              except urllib.error.HTTPError as error:

                  if error.code == 401:

                      refresh_access_token()

                      headers["Authorization"] = (
                          f"Bearer {ACCESS_TOKEN}"
                      )

                      request = urllib.request.Request(
                          url,
                          data=json.dumps(body).encode(),
                          headers=headers,
                          method="POST"
                      )

                      with urllib.request.urlopen(
                          request
                      ) as response:
                          return json.load(response)

                  raise


          files = []


          result = api_request(
              "https://api.dropboxapi.com/2/files/list_folder",
              {
                  "path":
                      DROPBOX_IMAGE_FOLDER,

                  "recursive":
                      False,

                  "include_media_info":
                      False,

                  "include_deleted":
                      False
              }
          )


          files.extend(
              result["entries"]
          )


          while result.get("has_more"):

              result = api_request(
                  "https://api.dropboxapi.com/2/files/list_folder/continue",
                  {
                      "cursor":
                          result["cursor"]
                  }
              )

              files.extend(
                  result["entries"]
              )


          print(
              f"Dropbox entries found: "
              f"{len(files)}"
          )


          # ---------------------------------------------------------
          # STEP 5: Sync images
          # ---------------------------------------------------------

          image_count = 0


          for entry in files:

              if entry.get(".tag") != "file":
                  continue


              name = entry["name"]


              if not name.lower().endswith(
                  (
                      ".jpg",
                      ".jpeg",
                      ".png",
                      ".webp"
                  )
              ):
                  continue


              local_file = (
                  LOCAL_IMAGE_FOLDER / name
              )


              # Skip files that already exist.
              # This makes future daily syncs much faster.

              if local_file.exists():

                  image_count += 1

                  continue


              print(
                  f"Downloading: {name}"
              )


              data = dropbox_download(
                  entry["path_lower"]
              )


              local_file.write_bytes(
                  data
              )


              image_count += 1


          print(
              f"Dropbox images available locally: "
              f"{image_count}"
          )


          print("Catalogue synchronization completed.")

          print(
              f"Products: {len(products)}"
          )

          print(
              f"Images: {image_count}"
          )

          PY


      - name: Commit and push changes
        run: |

          git config user.name "Delta Mart Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"

          git add images/ products.json

          if git diff --cached --quiet; then

            echo "No catalogue changes detected."

          else

            git commit \
              -m "Sync Delta Mart catalogue and images"

            git push

          fi
